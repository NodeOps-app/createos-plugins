name: langflow-sandbox-createos CI

# Lint and unit-test the one Python package in this repo. Path-filtered so the
# TypeScript packages never trigger a Python job and vice versa.
#
# These tests use httpx.MockTransport against a recorded fake control plane —
# no CreateOS credential, no live sandbox, nothing to leak. The tests that need
# a real control plane are run by hand and are not part of this workflow; a
# green run here means the wiring is sound, not that the platform behaved.

on:
  push:
    branches: [main]
    paths:
      - "packages/langflow-sandbox-createos/**"
      - ".github/workflows/langflow-sandbox-createos-ci.yml"
  pull_request:
    paths:
      - "packages/langflow-sandbox-createos/**"
      - ".github/workflows/langflow-sandbox-createos-ci.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/langflow-sandbox-createos

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from `requires-python`, and the version we develop against.
        # Testing the floor is the point: lfx supports 3.10-3.14 and a 3.12-only
        # syntax slip would otherwise ship.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Create the environment
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv/bin/python -e . pytest

      - name: Lint
        run: |
          uvx ruff check src tests
          uvx ruff format --check src tests

      - name: Unit tests
        env:
          # The tests assert on redaction and on fail-closed behaviour, so a
          # key must be present — a deliberately fake one.
          CREATEOS_SANDBOX_API_KEY: ci-not-a-real-key
        run: .venv/bin/python -m pytest tests/ -q

      - name: Entry points resolve
        # A wheel that builds but registers nothing is the failure mode that
        # already bit us once: a stray force-include silently produced a
        # package with no entry points and no components directory.
        run: |
          .venv/bin/python - <<'PY'
          import importlib.metadata as m

          groups = {
              "lfx.sandbox_backends": "createos",
              "langflow.extensions": "langflow-sandbox-createos",
              "lfx.executors": "createos",
          }
          eps = m.entry_points()
          for group, name in groups.items():
              names = [e.name for e in eps.select(group=group)]
              assert name in names, f"{name!r} missing from {group}: {names}"
              print(f"ok  {group} -> {name}")

          from langflow_sandbox_createos import create_backend
          from langflow_sandbox_createos.components.createos import CreateOSSandboxComponent
          from langflow_sandbox_createos.executor import CreateOSExecutor

          assert create_backend().capabilities().isolation == "hardware-virtualized"
          assert CreateOSSandboxComponent.display_name == "CreateOS Sandbox"
          assert CreateOSExecutor.kind == "createos"

          import pathlib
          import langflow_sandbox_createos as pkg

          manifest = pathlib.Path(pkg.__file__).parent / "extension.json"
          assert manifest.exists(), "extension.json missing from the installed package"
          print("ok  manifest ships")
          PY

  build:
    # Proves the sdist and wheel are publishable on every PR, so a packaging
    # mistake surfaces here rather than at tag time.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Build
        run: uv build --out-dir dist

      - name: Check metadata
        run: |
          uvx twine check dist/*
          uvx --from check-wheel-contents check-wheel-contents dist/*.whl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-preview
          path: packages/langflow-sandbox-createos/dist/
          retention-days: 7
